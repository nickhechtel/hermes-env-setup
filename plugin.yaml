name: env-setup
label: Setup Assistant
kind: standalone
version: 0.3.0
author: nick
description: >
  On-demand credential channel for Hermes. The agent requests environment
  variables by NAME only, when the chat actually needs them; the user fills
  a masked desktop form; values are written directly to .env and never
  enter the chat or the model context. Minimal by design — no provider
  catalog. Installed plugins declare their credentials via requires_env and
  the status tool reports them automatically.
provides_tools:
  - env_setup_prompt
  - env_setup_status
requires_env: []